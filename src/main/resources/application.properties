spring.application.name=BookManageSystem
server.port=8080
# 从程序工作目录读取 .env，按 properties 格式解析
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:${MYSQL_PORT:3307}/book_manage_system?useAffectedRows=false}
spring.datasource.username=${DB_USERNAME:book_app}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:}}

# 当前日志文件，相对于程序工作目录
logging.file.name=logs/book-manage.log

# 文件日志包含线程、请求编号及异常堆栈
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId}] %logger{36} - %msg%n%ex

# 按日期及文件大小滚动归档
logging.logback.rollingpolicy.file-name-pattern=logs/archive/book-manage.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB


#swagger ui
springdoc.swagger-ui.path=/docs

logging.level.root=INFO
logging.level.com.example.bookmanagesystem=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [requestId=%X{requestId}] %logger{36} - %msg%n