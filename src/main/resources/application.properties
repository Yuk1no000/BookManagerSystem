spring.application.name=BookManageSystem
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/book_manage_system?useAffectedRows=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

#swagger ui
springdoc.swagger-ui.path=/docs

logging.level.root=INFO
logging.level.com.example.bookmanagesystem=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [requestId=%X{requestId}] %logger{36} - %msg%n